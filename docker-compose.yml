# Local test harness. The mapper image is built from this checkout and copies
# the provider jar into a shared volume before Keycloak starts, the same way an
# init container does in Kubernetes.
services:
  mapper:
    build: .
    volumes:
      - providers:/providers

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    depends_on:
      mapper:
        condition: service_completed_successfully
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - providers:/opt/keycloak/providers:ro
      - ./hack/keycloak-init.sh:/opt/keycloak/keycloak-init.sh:ro
    entrypoint: ["/bin/bash", "/opt/keycloak/keycloak-init.sh"]

volumes:
  providers: {}
